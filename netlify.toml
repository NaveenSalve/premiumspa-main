[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist-functions"

# API requests route to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing for Single Page Application (React SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
